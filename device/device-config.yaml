local_devices:
- name: pump
  displayed_name: Pumpe
  displayed_description: ''
  gpio: 13
  power: 800
  hysteresis_seconds: 180
  re_hysteresis_seconds: 60
  min_active_time_seconds: 1200
  shutdown_time_seconds: 7200
  temperature_safety:
  - value_degrees_c: 0
    end_value_degrees_c: -1
    type: low
    interval_seconds: 3600
    sensor_name: air
    alert_enabled: false
  - value_degrees_c: -1
    end_value_degrees_c: -3
    type: low
    interval_seconds: 1800
    sensor_name: air
    alert_enabled: false
  - value_degrees_c: -3
    type: low
    interval_seconds: 900
    duration_seconds: 90
    sensor_name: air
  max_active_time_seconds: 86400
  importance: 0
  power_off_tolerance: 0
  disable_automatic_management: false
- name: heat_pump
