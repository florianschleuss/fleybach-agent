services:
  # Optional, read-only Zendure telemetry. Existing services are unaffected.
  zendure:
    profiles: ["zendure"]
    container_name: zendure
    restart: unless-stopped
    build: ./zendure
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    volumes:
      - ./utils:/usr/src/zendure/utils:ro
      - ./zendure/config.json:/config/zendure.json:ro
    environment:
      - CUSTOMER_DOMAIN
      - CUSTOMER_SECRET
      - AUTH_URL
      - PYTHONDONTWRITEBYTECODE=1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  # DS18B12 sensor read out
  temperature:
    container_name: temperature
    restart: always
    build: ./temperature
    privileged: true
    volumes:
      - ./temperature:/usr/src/temperature
      - ./utils:/usr/src/temperature/utils
      - /dev:/dev
    environment:
      - CUSTOMER_DOMAIN
      - CUSTOMER_SECRET
      - AUTH_URL
      - GMX_USERNAME
      - GMX_PASSWORD
      - ALERT_RECIPIENTS
  # SMA Tripower and serial powermeter read out
  power:
    container_name: power
    restart: always
    build: ./power
    privileged: true
    volumes:
      - ./power:/usr/src/power
      - ./utils:/usr/src/power/utils
      - /dev:/dev
    environment:
      - CUSTOMER_DOMAIN
      - CUSTOMER_SECRET
      - AUTH_URL
      - SMA_MODBUS_IP
      - SMA_MODBUS_PORT
  # Websocket endpoint
  device:
    container_name: device
    restart: always
    build: ./device
    privileged: true
    volumes:
      - ./device:/usr/src/device
      - ./utils:/usr/src/device/utils
    environment:
      - CUSTOMER_DOMAIN
      - CUSTOMER_SECRET
      - AUTH_URL
      - GMX_USERNAME
      - GMX_PASSWORD
      - ALERT_RECIPIENTS
